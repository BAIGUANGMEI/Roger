name: Release Windows portable build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, check, and package
        shell: pwsh
        env:
          ROGER_RELEASE_REF: ${{ github.ref }}
        run: |
          $rogerVersion = '0.1.0'
          if ($env:ROGER_RELEASE_REF.StartsWith('refs/tags/', [StringComparison]::Ordinal)) {
            $rogerTag = $env:ROGER_RELEASE_REF.Substring('refs/tags/'.Length)
            if (-not $rogerTag.StartsWith('v', [StringComparison]::Ordinal)) { throw 'Release tags must start with v.' }
            $rogerVersion = $rogerTag.Substring(1)
          }
          ./scripts/publish.ps1 -Version $rogerVersion
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Roger-win-x64
          path: |
            artifacts/Roger-win-x64.zip
            artifacts/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" artifacts/Roger-win-x64.zip artifacts/SHA256SUMS.txt --verify-tag --title "Roger $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
